<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <!-- Primary Meta Tags -->
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Title & SEO Description -->
    <title>RAG AI Workspace — Next-Gen AI Knowledge Base & Chat Platform</title>
    <meta
      name="title"
      content="RAG AI Workspace — Next-Gen AI Knowledge Base & Chat Platform"
    />
    <meta
      name="description"
      content="Empower your documents with Retrieval-Augmented Generation (RAG). Upload PDFs, TXT, or DOCX and query your internal knowledge base instantly with precise citations."
    />
    <meta
      name="keywords"
      content="RAG AI, Retrieval Augmented Generation, AI Document Chat, Vector Search, Knowledge Base AI, AI Chat App"
    />
    <meta name="author" content="Ghs Julian" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://yourdomain.com/" />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/png" href="/icons/favicon-2.png" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="msapplication-TileColor" content="#0f172a" />

    <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yourdomain.com/" />
    <meta
      property="og:title"
      content="RAG AI Workspace — Next-Gen AI Knowledge Base & Chat Platform"
    />
    <meta
      property="og:description"
      content="Chat with your documents seamlessly using high-speed vector retrieval and advanced RAG technology."
    />
    <meta
      property="og:image"
      content="https://yourdomain.com/icons/og-banner.png"
    />
    <meta property="og:site_name" content="RAG AI Workspace" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:url"
      content="https://yourdomain.com/icons/og-banner.png"
    />
    <meta
      name="twitter:title"
      content="RAG AI Workspace — Next-Gen AI Knowledge Base & Chat Platform"
    />
    <meta
      name="twitter:description"
      content="Chat with your documents seamlessly using high-speed vector retrieval and advanced RAG technology."
    />
    <meta
      name="twitter:image"
      content="https://yourdomain.com/icons/og-banner.png"
    />

    <!-- Font Preloading & Optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data / JSON-LD Schema for Search Engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "RAG AI Workspace",
        "url": "https://yourdomain.com/",
        "description": "Retrieval-Augmented Generation (RAG) powered chat workspace for querying vector-indexed custom documents.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "All",
        "author": {
          "@type": "Person",
          "name": "Ghs Julian"
        }
      }
    </script>
  </head>

  <body>
    <!-- Accessibility fallback for users with JavaScript disabled -->
    <noscript>
      <div
        style="
          padding: 20px;
          text-align: center;
          color: #f8fafc;
          background-color: #0f172a;
        "
      >
        <h2>JavaScript Required</h2>
        <p>
          Please enable JavaScript in your browser settings to run this
          application.
        </p>
      </div>
    </noscript>

    <!-- React Root Mount Point -->
    <div id="root"></div>

    <!-- Main React Entry Point -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
